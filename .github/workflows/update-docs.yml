name: Update Docs
on:
  push:
    branches: [main]
    paths:
      - 'registry/patterns.json'
      - 'core/.claude/**'
      - 'config/workflow-groups.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  docs:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @mermaid-js/mermaid-cli
      - run: pip install -r scripts/requirements.txt
      - name: Generate docs
        run: |
          PYTHONPATH=. python scripts/generate_docs.py
          PYTHONPATH=. python scripts/generate_workflow_docs.py --require-svg
      - name: Open docs PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain docs/)" ]; then
            branch="auto/docs-update-${{ github.run_id }}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b "$branch"
            git add docs/
            git commit -m "docs: auto-update dashboard and catalog"
            git push -u origin "$branch"
            gh pr create --base main --head "$branch" \
              --title "docs: auto-update dashboard and catalog" \
              --body "Automated docs regen (registry/core drift). Squash-auto-merges on green 'validate'."
            gh pr merge --squash --auto "$branch" \
              || echo "::warning::gh pr merge --auto failed — docs PR $branch left open for manual merge (check repo auto-merge setting)"
          fi
