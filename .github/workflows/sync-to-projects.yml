name: Sync to Projects
# STAGE-1 RETIREMENT (owner-approved 2026-07-13, claude-best-practices#346): the automatic
# push-triggered copy-sync is OFF — plugin-covered content now reaches projects via
# /plugin update (version-pinned, CI-gated by the version-bump gate). Manual dispatch is
# kept for the residual copy-provisioned surface (path-scoped rules, stack helpers without
# packs, project-owned templates) until stage 2 decides its final form.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Sync to registered projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: PYTHONPATH=. python scripts/sync_to_projects.py --all
