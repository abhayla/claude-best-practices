name: Check Standing Goals
on:
  schedule:
    - cron: '0 5 * * *'  # daily 5am UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Check standing goals
        id: sentinel
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/check_standing_goals.py | tee sentinel-report.txt
        continue-on-error: true
      - name: File or update issue if failing
        if: steps.sentinel.outcome == 'failure'
        run: |
          # Self-provisioning: ensure the labels exist (idempotent via --force) so a
          # fork/re-clone without them cannot fail issue creation silently.
          gh label create standing-goals --force --color 8250df --description "Standing-goal sentinel: an enrolled invariant is failing" || true
          gh label create maintenance --force --color fbca04 --description "Repository maintenance" || true
          BODY_FILE=sentinel-report.txt
          EXISTING=$(gh issue list --state open --label standing-goals --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          else
            gh issue create --title "Standing-goal sentinel: invariant(s) failing" \
              --label "standing-goals,maintenance" \
              --body-file "$BODY_FILE"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
