name: Recommend Resources
on:
  # Weekly cron RETIRED (#346 stage, owner-approved 2026-07-14): all 5 enrolled repos are
  # plugins-first (2026-07-13 migration sweep), so weekly copy-provision PRs are superseded by
  # `/plugin update` + config/plugin-recommendations.yml. Manual dispatch retained for
  # onboarding a NEW downstream repo; re-enable the cron by restoring the schedule block if
  # copy-distribution ever returns.
  workflow_dispatch:
    inputs:
      repo:
        description: 'Specific repo to recommend for (owner/repo)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  recommend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Run recommendations
        env:
          # Prefer a cross-repo PAT (HUB_SYNC_TOKEN) so provisioning can reach
          # PRIVATE enrolled repos; falls back to the default token for public repos.
          GITHUB_TOKEN: ${{ secrets.HUB_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.repo }}" ]; then
            echo "Running recommendations for ${{ inputs.repo }}"
            PYTHONPATH=. python scripts/recommend.py --repo "${{ inputs.repo }}" --provision --use-config
          else
            echo "Running recommendations for all auto_sync repos"
            # Parse repos.yml and run for each repo with auto_sync: true
            python -c "
          import yaml
          with open('config/repos.yml') as f:
              data = yaml.safe_load(f)
          for entry in data.get('repos', []):
              if entry.get('auto_sync', False):
                  print(entry['repo'])
          " | while read -r repo; do
              echo "=== Recommending for $repo ==="
              PYTHONPATH=. python scripts/recommend.py --repo "$repo" --provision --use-config || echo "Failed for $repo, continuing..."
            done
          fi
